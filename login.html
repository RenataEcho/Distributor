<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>右豹代理后台 - 登录 Demo</title>
  <style>
    :root {
      --primary: #456c9d;
      --line: #e1e5ea;
      --text: #1f2d3a;
      --muted: #9aa3ae;
      --gold: #c8a45c;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: linear-gradient(145deg, #17232d 0%, #243747 100%);
    }

    .screen {
      min-width: 1180px;
      min-height: 720px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 880px;
      height: 500px;
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 370px 1fr;
      box-shadow: 0 28px 64px rgba(0,0,0,.30);
    }

    .left {
      background: #121f29;
      color: #fff;
      padding: 36px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mark {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,.16);
    }

    .mark svg { width: 31px; height: 31px; }

    .brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .gold-line {
      width: 44px;
      height: 3px;
      background: var(--gold);
      border-radius: 2px;
      margin-top: 88px;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 42px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .desc {
      margin-top: 24px;
      color: #a9b4bf;
      line-height: 1.7;
      font-size: 14px;
    }

    .console {
      position: absolute;
      left: 36px;
      bottom: 35px;
      color: rgba(255,255,255,.24);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      letter-spacing: 4px;
    }

    .right {
      background: #fff;
      padding: 64px 105px;
    }

    h2 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: 27px;
      line-height: 1;
      font-weight: 800;
    }

    .sub {
      margin: 10px 0 35px;
      color: var(--muted);
      font-size: 14px;
    }

    .tabs {
      width: 300px;
      height: 38px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid #dfe3e8;
      margin-bottom: 15px;
    }

    .tab {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      position: relative;
    }

    .tab.active { color: #2f5c8a; }

    .tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: #2f5c8a;
    }

    .field {
      width: 300px;
      height: 39px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: #aeb7c1;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .captcha-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .captcha-row .field {
      width: 140px;
    }

    .captcha {
      width: 150px;
      height: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding-left: 7px;
      color: #799b36;
      font-family: Georgia, serif;
      font-size: 29px;
      letter-spacing: 11px;
      transform: skewX(-7deg);
    }

    .captcha span:nth-child(1) { color: #5b88c5; transform: rotate(-8deg); }
    .captcha span:nth-child(2) { color: #9cef77; transform: rotate(8deg); }
    .captcha span:nth-child(3) { color: #6a9447; transform: rotate(-4deg); }
    .captcha span:nth-child(4) { color: #7b3e2f; transform: rotate(6deg); }

    .captcha::before,
    .captcha::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      top: 14px;
      background: #4ba9c7;
      transform: rotate(7deg);
    }

    .captcha::after {
      top: 26px;
      background: #c14c4c;
      transform: rotate(-6deg);
    }

    .submit {
      width: 300px;
      height: 44px;
      border: 0;
      border-radius: 5px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 13px;
      padding-left: 13px;
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="card">
      <div class="left">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="2" y="2" width="44" height="44" rx="9" fill="#fff"/>
              <path d="M30.4 7.8c3.8 2.2 6.2 5.3 7.4 9.2-3.1-.8-5.7-.7-7.8.4-1.7.9-2.2 2.5-1.4 4.7 3.7.4 6.3 2 7.7 4.8 1.1 2.3.8 4.4-.9 6.4-3.7 4.5-9.4 6-17.1 4.5 2.8-2.1 4.2-4.3 4.3-6.5-4.5.9-8.4-.2-11.5-3.4-3.1-3.2-4-6.9-2.7-11.2 2.4 2 5.1 2.7 8.1 2.2 2.8-.5 5.1-1.9 6.8-4.2 1.7-2.3 4.1-4.6 7.1-6.9Z" fill="#f05a28"/>
              <path d="M28.7 18.3c-3.5 1.5-5.3 3.6-5.5 6.4-.1 2.2 1 4.1 3.4 5.7-4 .2-7.1-.7-9.2-2.7-1.5-1.4-2.1-3.1-1.8-5.1 2.4.3 4.7-.3 6.8-1.7 1.9-1.2 4-2.1 6.3-2.6Z" fill="#ff7a45"/>
            </svg>
          </div>
          <div class="brand-name">右豹代理</div>
        </div>

        <div class="gold-line"></div>
        <h1>后台<br>管理系统</h1>
        <div class="desc">代理开放 · 项目数据<br>代理业务统一管理入口</div>
        <div class="console">YOUBAO CONSOLE · 内部系统</div>
      </div>

      <div class="right">
        <h2>欢迎回来</h2>
        <div class="sub">使用管理员账号登录</div>
        <div class="tabs">
          <div class="tab active">账号密码登录</div>
          <div class="tab">手机短信登录</div>
        </div>
        <div class="field">♙ <span>账号</span></div>
        <div class="field">♙ <span>密码</span></div>
        <div class="captcha-row">
          <div class="field">♙ <span>验证码</span></div>
          <div class="captcha"><span>r</span><span>5</span><span>z</span><span>s</span></div>
        </div>
        <button class="submit">登录</button>
      </div>
    </section>
  </main>
</body>
</html>
